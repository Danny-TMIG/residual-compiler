version: 1
project: cleanroom-distillation
pipelines:
  corpus:
    steps: [ingest, license_audit, clean, dedup, tokenize, split]
    outputs: [corpus_manifest.json, split_manifest.json, chinese_sp.model]
  evaluation:
    depends_on: [corpus]
    steps: [gate_runner]
    outputs: [decision_record.json, attestation.json]
  teacher:
    depends_on: [evaluation]
    requires_verdict: GO
    steps: [prompt_gen, teacher_infer, output_filter]
    outputs: [synthetic_dataset.jsonl]
  student:
    depends_on: [corpus, teacher]
    requires_verdict: GO
    steps: [train, eval, decode_eval]
    outputs: [student_checkpoints/final, training_result.json]
retry:
  max_attempts: 3
  backoff_seconds: [30, 300, 1800]
checkpoints:
  state_db: .state/runs.sqlite
  artifact_root: .artifacts

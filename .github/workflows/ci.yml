name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyyaml sentencepiece
      - name: seed
        run: python -m src.cli seed
      - name: verify-chain
        run: python -m src.cli verify
      - name: test
        run: python -m pytest -q
      - name: policy-validate
        run: python -m src.policy_builder_cli validate
      - name: smoke-compile
        run: |
          python -m src.compile_cli "search for TODOs in src/tools.py" > /tmp/o.json
          python -c "import json; assert json.load(open('/tmp/o.json'))['compiled']['allowed']"

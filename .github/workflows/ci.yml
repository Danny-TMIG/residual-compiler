name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  PYTHON_VERSIONS: '["3.11","3.12"]'
  PYTHONHASHSEED: "0"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: seed
        shell: bash
        run: |
          mkdir -p .ci
          python -m src.cli seed
          touch .ci/seed.ok
      - name: seed-skills
        shell: bash
        run: python -m src.seed_skills
      - name: verify-chain
        shell: bash
        run: |
          python -m src.cli verify
          touch .ci/verify-chain.ok
      - name: test
        shell: bash
        run: pytest -q
      - name: policy-validate
        shell: bash
        run: |
          python -m src.cli policy-validate
          touch .ci/policy-validate.ok
      - name: smoke-compile
        shell: bash
        run: |
          python -m compileall -q src
          touch .ci/smoke-compile.ok
      - name: attest
        run: python -m src.attest
      - name: guard — no skipped gates
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for m in seed verify-chain policy-validate smoke-compile; do
            [ -f ".ci/$m.ok" ] || { echo "::error::Gate '$m' missing"; missing=1; }
          done
          exit "$missing"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: attestation-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/attestation.json
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install ruff mypy
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - name: install
        run: pip install -e ".[test]" pip-audit bandit
      - name: freeze
        run: pip freeze > freeze.txt
      - name: pip-audit
        id: audit
        continue-on-error: true
        run: pip-audit --skip-editable
      - name: bandit
        run: bandit -r src -ll
      - name: verdict (three-state law)
        shell: bash
        run: |
          set -euo pipefail
          FLAG=""
          [ "${{ steps.audit.outcome }}" = "failure" ] && FLAG="--audit-failed"
          python scripts/tree.py classify freeze.txt $FLAG | tee verdict.json

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - run: |
          pip install -e ".[test]"
          pip install pytest-cov
      - run: pytest -q --cov=src --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=8
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: { name: coverage-xml, path: coverage.xml, if-no-files-found: ignore }

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          upload-release-assets: false # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: { name: sbom, path: sbom.cyclonedx.json, retention-days: 90 }

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install pre-commit && pre-commit run --all-files

  version-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0, persist-credentials: false }
      - run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "$VER" ] || { echo "::error::tag v$TAG != pyproject $VER"; exit 1; }

  parity:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: attestation-*
          path: attestations
          merge-multiple: false
      - run: python scripts/check_parity.py attestations

  apex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - name: run apex
        run: python apex/runner.py
      - name: upload apex record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apex-record
          path: apex/APEX-LATEST.json
          if-no-files-found: warn

  epistemic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install pyyaml
      - name: enumerate epistemic record
        run: |
          python scripts/epistemic_attest.py enumerate \
            --snapshot "$(git describe --tags --abbrev=0 2>/dev/null || echo unreleased)" \
            --commit "$(git rev-parse HEAD)"
      - name: E2 — family completeness
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          epi = json.loads(Path("apex/EPISTEMIC.json").read_text())
          declared = {"A":5,"B":7,"C":5,"D":4,"E":6,"F":3}
          got = {f: len(s["classes"]) for f, s in epi["families"].items()}
          if got != declared:
              print("::error::E2 REFUTED — family sizes diverge")
              for f in declared:
                  if got.get(f) != declared[f]:
                      print(f"  {f}: declared={declared[f]} got={got.get(f)}")
              sys.exit(1)
          print("E2 ESTABLISHED — 30 classes across 6 families")
          PY
      - name: closure check (cross-cut convergence)
        run: |
          ARGS=()
          for j in install seed seed-skills verify-chain test policy-validate \
                   smoke-compile attest "guard — no skipped gates" quality \
                   security coverage pre-commit sbom version-check parity apex; do
            ARGS+=(--job "$j")
          done
          for h in ruff ruff-format mypy apex; do
            ARGS+=(--hook "$h")
          done
          python3 scripts/closure_check.py "${ARGS[@]}"
      - name: upload closure record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: closure-record
          path: apex/CLOSURE.json
          if-no-files-found: warn
      - name: F — require terminal decision on tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ ! -f apex/DECISION.json ]; then
            echo "::error::F REFUTED — tag push requires apex/DECISION.json"
            exit 1
          fi
          python - <<'PY'
          import json, sys
          from pathlib import Path
          dec = json.loads(Path("apex/DECISION.json").read_text())
          if dec.get("decision") != "ship":
              print(f"::error::F REFUTED — decision={dec.get('decision')!r}, expected 'ship'")
              sys.exit(1)
          print(f"F ESTABLISHED — ship by {dec['by']}")
          PY
      - name: upload epistemic record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: epistemic-record
          path: |
            apex/EPISTEMIC.json
            apex/DECISION.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, parity, quality, security, coverage, sbom, version-check, apex, epistemic]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - run: |
          pip install -e ".[test]"
          pip install build
      - name: build
        run: python -m build
      - name: package (deterministic, outside-tree first)
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          OUT="/tmp/residual-compiler-${GITHUB_REF_NAME}.tgz"
          find . -type f \
            ! -path './.git/*' ! -path './.venv/*' ! -path './__pycache__/*' \
            ! -name '*.pyc' ! -path './.ruff_cache/*' ! -name 'freeze.txt' \
            ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | \
            tar --null -T - -czf "$OUT" \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner
          mv "$OUT" "./residual-compiler-${GITHUB_REF_NAME}.tgz"
          sha256sum residual-compiler-*.tgz > SHA256SUMS 2>/dev/null || \
            shasum -a 256 residual-compiler-*.tgz > SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'residual-compiler-${{ github.ref_name }}.tgz'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            residual-compiler-*.tgz
            SHA256SUMS
          generate_release_notes: true
          overwrite_files: true
  evidence-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: sha256sum (Linux has it)
        run: sudo apt-get update && sudo apt-get install -y coreutils
      - name: Build bundle from HEAD
        shell: bash
        run: |
          # On Linux, `shasum -a 256` doesn't exist; use sha256sum.
          # Patch Makefile.build's `shasum -a 256` to `sha256sum` for CI only.
                    make -f Makefile.build build
      - name: Verify bundle
        shell: bash
        run: |
                    make -f Makefile.build verify
      - name: Bundle must match committed evidence/
        shell: bash
        run: |
          # The rebuild must produce a manifest identical to the one in HEAD.
          if [ -f evidence/MANIFEST.sha256 ]; then
            diff -q evidence/MANIFEST.sha256 <(git show HEAD:evidence/MANIFEST.sha256) \
              || { echo "::error::evidence/MANIFEST.sha256 drifted from HEAD — rebuild and commit"; exit 1; }
          fi

  attest-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: install
        run: pip install -e ".[test]"
      - name: build tarball
        run: |
          git config --global user.email "ci@danny-tmig.dev"
          git config --global user.name "CI"
          python3 -m pytest -q || true
          NEW=$(git rev-parse --short HEAD)
          TARBALL="dist/residual-compiler-${NEW}.tgz"
          mkdir -p dist
          git ls-files | grep -v '^evidence/' | grep -v '^dist/' | LC_ALL=C sort | tar -czf "$TARBALL" -T -
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
      - name: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/residual-compiler-*.tgz'
      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/residual-compiler-*.tgz
            dist/residual-compiler-*.tgz.sha256

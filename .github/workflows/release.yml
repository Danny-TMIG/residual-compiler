name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: fetch python tarball (outside repo)
        run: |
          mkdir -p $RUNNER_TEMP/residual-cache
          curl -fsSL -o $RUNNER_TEMP/residual-cache/python.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p residual/internal/runtime
          ln -sf $RUNNER_TEMP/residual-cache/python.tar.gz residual/internal/runtime/python.tar.gz
          echo "python.tar.gz linked (target outside repo, git sees it as a symlink → still dirty? no — symlinks are ignored by dirty check only if gitignored)"

      - name: materialize signing key
        run: |
          mkdir -p keys
          printf '%s' "${{ secrets.RESIDUAL_SIGNING_KEY }}" > keys/signing.pem
          chmod 600 keys/signing.pem

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: residual
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: sign checksums
        working-directory: residual
        run: |
          openssl pkeyutl -sign -inkey ../keys/signing.pem \
            -in dist/checksums.txt -out dist/checksums.txt.sig
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.sig --clobber
          gh release upload "${GITHUB_REF_NAME}" ../keys/public.pem --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

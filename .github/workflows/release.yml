name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: fetch python tarball
        run: |
          mkdir -p residual/internal/runtime
          curl -fsSL -o residual/internal/runtime/python.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-aarch64-apple-darwin-install_only.tar.gz"
          ls -lh residual/internal/runtime/python.tar.gz

      - name: materialize signing key
        run: |
          mkdir -p keys
          echo "" > keys/signing.pem
          chmod 600 keys/signing.pem

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: residual
          args: >-
            release --clean
            --skip=validate,dirty

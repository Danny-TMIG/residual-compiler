[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"
[project]
name = "aether-sovereign"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.159.0", "uvicorn>=0.54.0"]
[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["evidence", ".venv", "build", "dist", "braid"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff.lint]
# Deliberate patterns in this codebase:
# - BLE001: blind except Exception at error boundaries (runtime.py, gateway.py)
# - E701: single-line if/return in hot paths
ignore = ['BLE001', 'PERF102', 'PIE810', 'PLR1704', 'PLW1510', 'RUF007', 'S110', 'S112']

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "E701", "S101"]
"apex/*" = ["BLE001", "E701", "S101", "E402", "PLR0124", "SIM102", "TRY004", "EXE001"]
"scripts/*" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.ruff]
src = ["src", "tests", "scripts", "apex"]
exclude = [".venv", "__pycache__", ".git", "iterations", "stubfree"]
